name: PR Checks

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  cypress-blocking-checks:
    name: Cypress Blocking PR Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Run Cypress critical flows
        uses: cypress-io/github-action@v6
        with:
          start: npm run start
          wait-on: "http://localhost:3000"
          browser: chrome
          spec: cypress/e2e/critical-flows.cy.ts
